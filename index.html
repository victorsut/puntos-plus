<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Puntos Plus</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FBBC04" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Puntos Plus" />
  <!-- UX-10 (7-nov-2026): preconexión a Google Fonts y hoja NO bloqueante
       (display=swap ya permite pintar con la fuente del sistema) — antes el
       primer frame esperaba el CSS de las fuentes además del bundle. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
  <!-- ANIMACIÓN DE ENTRADA EN EL HTML (10-nov-2026, pedido del dueño): la
       lluvia de monedas PP y el logotipo circular son LO PRIMERO que se ve
       al abrir la app y se repiten EN BUCLE mientras baja el bundle y los
       datos del arranque. Antes vivían en SplashIntro.jsx (dentro del
       bundle de ~780 KB) y mientras tanto solo se veía un isotipo estático.
       CSS puro transform/opacity; SplashIntro.jsx ahora solo decide cuándo
       retirarla (datos cargados + al menos una pasada completa). -->
  <style>
    #pp-splash {
      position: fixed; inset: 0; z-index: 1000; overflow: hidden; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 28%, #F6F2EE 0%, #E9E3DD 55%, #DCD5CE 100%);
      font-family: 'DM Sans', Arial, sans-serif;
      transition: opacity 380ms ease;
      -webkit-tap-highlight-color: transparent;
    }
    #pp-splash.pp-leaving { opacity: 0; pointer-events: none; }
    #pp-splash .ab { position: absolute; left: 50%; top: 50%; }
    #pp-splash svg { display: block; }
    /* Lluvia con rebote, EN BUCLE: X lineal de izquierda a derecha… */
    @keyframes ppCoinX {
      0% { transform: translateX(var(--x0)); opacity: 0; }
      7% { opacity: 1; } 88% { opacity: 1; }
      100% { transform: translateX(var(--x1)); opacity: 0; }
    }
    /* …e Y con GRAVEDAD por tramos: caída, rebote y dos rebotes menores */
    @keyframes ppCoinY {
      0% { transform: translateY(var(--y0)); animation-timing-function: cubic-bezier(.4,0,.85,.45); }
      40% { transform: translateY(var(--floor)); animation-timing-function: cubic-bezier(.15,.55,.45,1); }
      62% { transform: translateY(calc(var(--floor) - var(--b1))); animation-timing-function: cubic-bezier(.55,0,.85,.45); }
      79% { transform: translateY(var(--floor)); animation-timing-function: cubic-bezier(.15,.55,.45,1); }
      90% { transform: translateY(calc(var(--floor) - var(--b2))); animation-timing-function: cubic-bezier(.55,0,.85,.45); }
      100% { transform: translateY(calc(var(--floor) + 6vh)); }
    }
    @keyframes ppCoinSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(var(--spin)); } }
    /* estela de luz: visible al CAER, se apaga al subir en el rebote */
    @keyframes ppTrail {
      0% { opacity: 0; } 10% { opacity: .85; } 38% { opacity: .9; } 46% { opacity: .15; }
      62% { opacity: .1; } 76% { opacity: .5; } 82% { opacity: .15; } 100% { opacity: 0; }
    }
    /* destello del impacto: mismo período que la moneda, en su 40 % */
    @keyframes ppFlash {
      0%, 36% { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(.25); }
      42% { opacity: .95; transform: translate(var(--fx), var(--fy)) scale(1); }
      68%, 100% { opacity: 0; transform: translate(var(--fx), var(--fy)) scale(1.7); }
    }
    @keyframes ppSplashFlip {
      0% { transform: rotateY(230deg) scale(.35) translateY(-30px); opacity: 0; }
      45% { opacity: 1; }
      80% { transform: rotateY(-12deg) scale(1.05) translateY(0); }
      100% { transform: rotateY(0deg) scale(1) translateY(0); }
    }
    @keyframes ppSplashFloat {
      0%, 100% { transform: translateY(0) rotate(-2.5deg); }
      50% { transform: translateY(-5px) rotate(2.5deg); }
    }
    /* anillo naranja EN BUCLE: se llena y se vacía hacia adelante */
    @keyframes ppSplashRing {
      0% { stroke-dashoffset: 351.9; }
      55% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -351.9; }
    }
    @keyframes ppSplashGlow { 0% { opacity: 0; transform: scale(.6); } 100% { opacity: 1; transform: scale(1); } }
    @keyframes ppSplashSheen {
      0% { transform: translateX(-130%) rotate(18deg); }
      30%, 100% { transform: translateX(130%) rotate(18deg); }
    }
    @keyframes ppSplashRise { 0% { transform: translateY(16px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
    @keyframes ppSplashTrackIn { 0% { letter-spacing: 12px; opacity: 0; } 100% { letter-spacing: 5px; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      #pp-splash * { animation: none !important; }
      #pp-splash .pp-rain { display: none !important; }
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="loading">
      <!-- Círculo del isotipo Puntos Plus girando (mismos trazos que LogoSpinner.jsx):
           queda para operador/admin y para las recargas sin animación de entrada -->
      <svg class="spinner" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M9.86 38.14A20 20 0 0 1 34 6.68" fill="none" stroke="#0D0D0D" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M38.14 9.86A20 20 0 0 1 18.82 43.32" fill="none" stroke="#FA5408" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <div class="label" style="font-weight:700;color:#757575">Cargando Puntos Plus...</div>
    </div>
  </div>

  <!-- Animación de entrada (fuera de #root: React no la borra al montar) -->
  <div id="pp-splash" role="presentation" aria-hidden="true">
    <div style="position:relative;display:flex;flex-direction:column;align-items:center">
      <!-- resplandor naranja tras la moneda héroe -->
      <div style="position:absolute;top:-30px;left:50%;width:240px;height:240px;margin-left:-120px;border-radius:50%;background:radial-gradient(circle,rgba(250,84,8,.20) 0%,rgba(250,84,8,0) 65%);animation:ppSplashGlow .8s .15s ease-out both"></div>
      <!-- bloque héroe 128×128: anillo + moneda con volteo 3D -->
      <div style="position:relative;width:128px;height:128px;perspective:700px">
        <svg width="128" height="128" viewBox="0 0 128 128" style="position:absolute;inset:0;transform:rotate(-90deg);animation:ppSplashRise .4s .3s ease-out both">
          <circle cx="64" cy="64" r="56" fill="none" stroke="rgba(0,0,0,.08)" stroke-width="4"/>
          <circle cx="64" cy="64" r="56" fill="none" stroke="#FA5408" stroke-width="4" stroke-linecap="round" stroke-dasharray="351.9" style="animation:ppSplashRing 2.4s .42s cubic-bezier(.3,.1,.3,1) infinite both"/>
        </svg>
        <div style="position:absolute;top:16px;left:16px;animation:ppSplashFlip .7s cubic-bezier(.2,.8,.3,1.1) both;transform-style:preserve-3d">
          <div style="animation:ppSplashFloat 2.6s .8s ease-in-out infinite">
            <div id="pp-splash-hero" style="position:relative;width:96px;height:96px;border-radius:50%;overflow:hidden;box-shadow:0 10px 22px rgba(90,40,0,.30),0 0 26px 4px rgba(250,84,8,.35),0 0 60px 14px rgba(250,84,8,.14)">
              <div style="position:absolute;top:-20px;left:0;width:46px;height:140px;z-index:1;background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 100%);animation:ppSplashSheen 2.4s 1.55s ease-in-out infinite both"></div>
            </div>
          </div>
        </div>
      </div>
      <!-- wordmark PUNTOS PLUS (D30) -->
      <div style="margin-top:22px;display:flex;flex-direction:column;align-items:center;line-height:1">
        <span style="font-size:15px;font-weight:900;color:#1A1A1A;letter-spacing:5px;animation:ppSplashTrackIn .55s 1.35s cubic-bezier(.2,.7,.3,1) both">PUNTOS</span>
        <span style="font-size:32px;font-weight:900;color:#FA5408;letter-spacing:3.5px;margin-top:3px;animation:ppSplashRise .5s 1.5s cubic-bezier(.2,.7,.3,1) both">PLUS</span>
      </div>
    </div>
  </div>

  <script>
    // CUÁNDO se muestra (regla del dueño 15-ago, intacta): solo vista
    // CLIENTE; sin sesión (login) en CADA carga; con sesión solo el
    // arranque en frío (sessionStorage pp_splash_seen) — la recarga al
    // volver de la encuesta Shell NO la repite ni retrasa el
    // SurveyResultModal. Sin animación se quita el nodo y queda el
    // spinner de siempre. Un tap la salta (la retira SplashIntro.jsx).
    (function () {
      var splash = document.getElementById('pp-splash');
      var rol = (new URLSearchParams(location.search).get('rol') || '').toLowerCase();
      var logged = false, seen = false;
      try { logged = !!((JSON.parse(localStorage.getItem('ct_me') || 'null') || {}).id); } catch (e) { /* noop */ }
      try { seen = !!sessionStorage.getItem('pp_splash_seen'); } catch (e) { /* noop */ }
      if (rol === 'admin' || rol === 'operador' || rol === 'operator' || (logged && seen)) {
        splash.parentNode.removeChild(splash);
        return;
      }
      try { sessionStorage.setItem('pp_splash_seen', '1'); } catch (e) { /* noop */ }
      document.documentElement.style.background = '#EDE7E1'; // sin destello blanco
      window.__ppSplash = { start: Date.now(), skipped: false };
      splash.addEventListener('click', function () { window.__ppSplash.skipped = true; window.dispatchEvent(new Event('pp-splash-skip')); });

      // Moneda PP 3D (misma que la versión React): canto, cara con
      // degradado radial, aro biselado, brillo y el monograma con extrusión.
      function coin(size, id) {
        function P(x, y, fill, color) {
          var s = '';
          for (var i = 0; i < 3; i++) {
            var d = (3 - i) * 1.1;
            s += '<text x="' + (x + d) + '" y="' + (y + d) + '" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Arial, sans-serif" font-weight="900" font-style="italic" font-size="42" fill="' + color + '">P</text>';
          }
          return s + '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" font-family="DM Sans, Arial, sans-serif" font-weight="900" font-style="italic" font-size="42" fill="' + fill + '">P</text>';
        }
        return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 96 96"><defs>'
          + '<radialGradient id="ppf' + id + '" cx="35%" cy="28%" r="85%"><stop offset="0%" stop-color="#FF9E52"/><stop offset="52%" stop-color="#FA5408"/><stop offset="100%" stop-color="#D84202"/></radialGradient>'
          + '<linearGradient id="ppe' + id + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D24A05"/><stop offset="100%" stop-color="#7E2900"/></linearGradient></defs>'
          + '<circle cx="48" cy="52" r="44" fill="url(#ppe' + id + ')"/>'
          + '<circle cx="48" cy="46" r="44" fill="url(#ppf' + id + ')"/>'
          + '<circle cx="48" cy="46" r="44" fill="none" stroke="#C24102" stroke-width="1.5"/>'
          + '<circle cx="48" cy="46" r="37" fill="none" stroke="rgba(126,41,0,.28)" stroke-width="1.5"/>'
          + '<ellipse cx="40" cy="22" rx="26" ry="10" fill="rgba(255,255,255,.4)" transform="rotate(-16 40 22)"/>'
          + P(40, 38, '#FFFFFF', 'rgba(60,25,0,.38)') + P(57, 55, '#0D0D0D', '#7A2A00') + '</svg>';
      }
      document.getElementById('pp-splash-hero').insertAdjacentHTML('afterbegin', coin(96, 'h'));

      // Lluvia: caen de ARRIBA-IZQUIERDA, rebotan y salen por ABAJO-DERECHA,
      // cada una repitiéndose cada DUR ms (bucle continuo mientras carga).
      var DUR = 1550;
      var COINS = [
        [-46, 54, -58, 30, 17, 7, 150, 46, 620], [-52, 48, -52, 34, 14, 6, 330, 38, 540],
        [-40, 58, -62, 26, 19, 8, 510, 52, 700], [-55, 50, -48, 36, 12, 5, 690, 34, 500],
        [-44, 56, -60, 31, 16, 7, 870, 44, 640], [-50, 46, -54, 35, 13, 6, 1050, 40, 560],
        [-38, 60, -64, 28, 18, 8, 1230, 48, 680]
      ];
      var html = '';
      COINS.forEach(function (c, i) {
        var x0 = c[0], x1 = c[1], y0 = c[2], fl = c[3], b1 = c[4], b2 = c[5], dl = c[6], sz = c[7], sp = c[8];
        var anim = DUR + 'ms ' + dl + 'ms linear infinite both';
        var tw = Math.max(12, sz * 0.34);
        html += '<div class="ab pp-rain" style="width:120px;height:34px;margin-left:-60px;margin-top:8px;--fx:' + (x0 + (x1 - x0) * 0.4).toFixed(1) + 'vw;--fy:' + fl + 'vh;'
          + 'background:radial-gradient(ellipse,rgba(255,244,230,.95) 0%,rgba(255,178,102,.75) 35%,rgba(250,84,8,.28) 60%,rgba(250,84,8,0) 80%);filter:blur(1.5px);border-radius:50%;'
          + 'animation:ppFlash ' + DUR + 'ms ' + (dl - 60) + 'ms ease-out infinite both;will-change:transform,opacity"></div>';
        html += '<div class="ab pp-rain" style="margin-left:' + (-sz / 2) + 'px;margin-top:' + (-sz / 2) + 'px;--x0:' + x0 + 'vw;--x1:' + x1 + 'vw;--y0:' + y0 + 'vh;--floor:' + fl + 'vh;--b1:' + b1 + 'vh;--b2:' + b2 + 'vh;--spin:' + sp + 'deg;animation:ppCoinX ' + anim + ';will-change:transform,opacity">'
          + '<div style="animation:ppCoinY ' + anim + '">'
          + '<div style="position:absolute;left:50%;bottom:' + (sz * 0.4) + 'px;width:' + tw + 'px;height:' + (sz * 4.4) + 'px;margin-left:' + (-tw / 2) + 'px;transform-origin:50% 100%;transform:rotate(-17deg);'
          + 'background:linear-gradient(to top,rgba(255,182,112,.95) 0%,rgba(255,205,160,.5) 45%,rgba(255,230,200,0) 100%);filter:blur(4px);border-radius:50%;animation:ppTrail ' + anim + '"></div>'
          + '<div style="width:' + sz + 'px;height:' + sz + 'px;border-radius:50%;box-shadow:0 8px 16px rgba(90,40,0,.28),0 0 18px rgba(250,84,8,.35);animation:ppCoinSpin ' + anim + '">' + coin(sz, 's' + i) + '</div>'
          + '</div></div>';
      });
      splash.insertAdjacentHTML('afterbegin', html);
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
