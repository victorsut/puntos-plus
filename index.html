<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Puntos Plus</title>
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#FBBC04" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Puntos Plus" />
  <!-- UX-10 (7-nov-2026): preconexión a Google Fonts y hoja NO bloqueante
       (display=swap ya permite pintar con la fuente del sistema) — antes el
       primer frame esperaba el CSS de las fuentes además del bundle. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" /></noscript>
</head>
<body>
  <div id="root">
    <div id="loading">
      <!-- Círculo del isotipo Puntos Plus girando (mismos trazos que LogoSpinner.jsx) -->
      <svg class="spinner" width="48" height="48" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M9.86 38.14A20 20 0 0 1 34 6.68" fill="none" stroke="#0D0D0D" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M38.14 9.86A20 20 0 0 1 18.82 43.32" fill="none" stroke="#FA5408" stroke-width="4.5" stroke-linecap="round"/>
      </svg>
      <div class="label" style="font-weight:700;color:#757575">Cargando Puntos Plus...</div>
    </div>
  </div>
  <script>
    // Sin "Cargando..." antes de la INTRO (dueño 15-ago): cuando la
    // animación de entrada va a mostrarse, este arranque oculta el TEXTO
    // y pinta el fondo PERLA del splash desde el primer frame (sin
    // destello blanco). UX-10 (7-nov-2026): el isotipo girando SÍ se
    // queda — antes la pantalla quedaba perla y vacía los segundos que
    // tarda en bajar el bundle (~780 KB) y el socio creía que la app no
    // abría. Refleja EXACTAMENTE la regla de SplashIntro.jsx: cliente en
    // login = siempre; cliente con sesión = solo arranque en frío
    // (pp_splash_seen). Operador/admin y las recargas sin intro
    // conservan el spinner de siempre.
    (function () {
      var rol = (new URLSearchParams(location.search).get('rol') || '').toLowerCase();
      if (rol === 'admin' || rol === 'operador' || rol === 'operator') return;
      var logged = false, seen = false;
      try { logged = !!((JSON.parse(localStorage.getItem('ct_me') || 'null') || {}).id); } catch (e) { /* noop */ }
      try { seen = !!sessionStorage.getItem('pp_splash_seen'); } catch (e) { /* noop */ }
      if (logged && seen) return; // no habrá intro: se queda el spinner
      var el = document.getElementById('loading');
      if (el) el.className = 'pre-intro';
      document.documentElement.style.background = '#EDE7E1';
    })();
  </script>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
